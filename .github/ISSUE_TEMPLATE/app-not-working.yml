name: Nachsatz does not work in an app
description: No suggestions, wrong position, flicker
labels: [app-support]
body:
  - type: input
    id: app
    attributes: { label: App and version }
    validations: { required: true }
  - type: input
    id: last
    attributes: { label: "Menu line “Zuletzt: …”" }
  - type: textarea
    id: what
    attributes:
      label: "What happened?"
      description: "No private text, please."
    validations: { required: true }
  - type: input
    id: system
    attributes: { label: macOS version and Mac }
    validations: { required: true }
