name: Bug
description: Something else is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: "What happened, and what did you expect?"
      description: "No private text, please."
    validations: { required: true }
  - type: input
    id: system
    attributes: { label: "macOS version, Mac and Nachsatz version" }
    validations: { required: true }
